[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lighttrace"
dynamic = ["version"]  # from lighttrace/__init__.py
description = "Self-hosted tracing for AI apps and agents: one register() call in the app, one small server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ganesh" }]
requires-python = ">=3.10"
keywords = ["tracing", "observability", "opentelemetry", "llm", "agents", "genai", "langchain", "langgraph",
            "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
# What an app installs: the OpenTelemetry sender and OpenTelemetry's official GenAI listeners
# (small, pure Python; none pulls in the framework it listens to). register() turns on the
# ones whose framework is installed.
dependencies = [
    "opentelemetry-sdk>=1.43,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.43,<2",
    # OpenInference's where the official listener is missing or records too little (see client.py)
    "openinference-instrumentation-langchain>=0.1.70",
    "openinference-instrumentation-llama-index>=4",
    "openinference-instrumentation-crewai>=1",
    "opentelemetry-instrumentation-genai-openai-agents>=1.2b0,<2",
    "opentelemetry-instrumentation-genai-dspy>=1.2b0,<2",
    "opentelemetry-instrumentation-genai-smolagents>=1.2b0,<2",
    "opentelemetry-instrumentation-genai-agno>=1.2b0,<2",
    "opentelemetry-instrumentation-genai-qwen-agent>=1.2b0,<2",
    "opentelemetry-instrumentation-genai-openai>=1.2b0,<2",
    "opentelemetry-instrumentation-genai-anthropic>=1.2b0,<2",
    "opentelemetry-instrumentation-genai-bedrock>=1.2b0,<2",
    "opentelemetry-instrumentation-google-genai>=1.2b0,<2",
    "opentelemetry-instrumentation-genai-portkey>=1.2b0,<2",
]

[project.optional-dependencies]
# The server: pip install "lighttrace[server]" (and [postgres] for a postgresql:// database).
server = ["fastapi>=0.110", "uvicorn>=0.29", "opentelemetry-proto>=1.20"]
postgres = ["psycopg[binary]>=3.1"]
test = ["pytest", "httpx", "langgraph", "langchain-core", "langsmith", "psycopg[binary]>=3.1"]
# Everything for working on LightTrace: pip install -e ".[dev]"
dev = ["lighttrace[server,postgres,test]", "ruff>=0.17", "build", "twine"]

[project.scripts]
lighttrace = "lighttrace:main"

[tool.setuptools.packages.find]
include = ["lighttrace", "lighttrace.*"]  # lighttrace.static: the UI files

[tool.setuptools.package-data]
lighttrace = ["static/*"]

[tool.setuptools.dynamic]
version = { attr = "lighttrace.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]  # small local lambdas as helpers
