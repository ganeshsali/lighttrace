[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lighttrace"
version = "0.1.0"
description = "Lightweight self-hosted tracing server for LLM apps and agents (OpenTelemetry and LangSmith SDK compatible)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "opentelemetry-proto>=1.20"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
grpc = ["grpcio>=1.60"]
test = ["pytest", "httpx", "langgraph", "langchain-core", "langsmith", "psycopg[binary]>=3.1",
        "opentelemetry-sdk", "opentelemetry-exporter-otlp-proto-http", "langfuse>=3,<4",
        "grpcio>=1.60", "opentelemetry-exporter-otlp-proto-grpc"]

[project.scripts]
lighttrace = "lighttrace.app:main"

[tool.setuptools]
packages = ["lighttrace"]

[tool.setuptools.package-data]
lighttrace = ["static/*"]
